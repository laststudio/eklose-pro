name: 'Fetch latest ekwing resolver SO'
description: '从 ekwing_resolver 最新 Release 下载 libekwing_resolver.so，校验后覆盖到 jniLibs'
inputs:
  token:
    description: '可读取 ekwing_resolver 仓库的 GitHub Token'
    required: true
  so-repo:
    description: '解析器 so 所在仓库'
    required: false
    default: 'rzsgsfm/ekwing_resolver'
  release-tag:
    description: '指定 so 版本标签（留空使用最新 Release）'
    required: false
    default: ''
  jni-libs-dir:
    description: 'arm64 so 目标目录'
    required: false
    default: 'app/src/main/jniLibs/arm64-v8a'
outputs:
  resolver-tag:
    description: '实际使用的 ekwing_resolver Release 标签'
    value: ${{ steps.fetch.outputs.resolver_tag }}
runs:
  using: composite
  steps:
    - name: Download and verify SO
      id: fetch
      shell: bash
      env:
        SO_TOKEN: ${{ inputs.token }}
        SO_REPO: ${{ inputs.so-repo }}
        SO_TAG: ${{ inputs.release-tag }}
        JNI_DIR: ${{ inputs.jni-libs-dir }}
      run: |
        set -euo pipefail
        if [ -z "${SO_TOKEN}" ]; then
          echo "缺少读取 ${SO_REPO} 的 GitHub Token" >&2
          exit 1
        fi
        rm -rf so_dist
        mkdir -p so_dist
        if [ -n "${SO_TAG}" ]; then
          TAG="${SO_TAG}"
        else
          TAG="$(GH_TOKEN="${SO_TOKEN}" gh release view --repo "${SO_REPO}" --json tagName --jq .tagName)"
        fi
        echo "resolver_tag=${TAG}" >> "$GITHUB_OUTPUT"
        echo "使用 ${SO_REPO} 的解析器版本：${TAG}"
        GH_TOKEN="${SO_TOKEN}" gh release download "${TAG}" \
          --repo "${SO_REPO}" \
          --pattern 'libekwing_resolver-arm64-v8a.so' \
          --dir so_dist \
          --clobber
        if ! GH_TOKEN="${SO_TOKEN}" gh release download "${TAG}" \
          --repo "${SO_REPO}" \
          --pattern 'SHA256SUMS' \
          --dir so_dist \
          --clobber; then
          echo "Release ${TAG} 缺少 SHA256SUMS，无法校验下载产物" >&2
          exit 1
        fi
        expected_so="$(awk '$2 ~ /\/?libekwing_resolver-arm64-v8a\.so$/ {print $1; exit}' so_dist/SHA256SUMS)"
        if [ -z "${expected_so}" ]; then
          echo "SHA256SUMS 中找不到 libekwing_resolver-arm64-v8a.so 条目" >&2
          exit 1
        fi
        actual_so="$(sha256sum so_dist/libekwing_resolver-arm64-v8a.so | awk '{print $1}')"
        if [ "${actual_so}" != "${expected_so}" ]; then
          echo "so 下载校验失败：期望 ${expected_so} 实际 ${actual_so}" >&2
          exit 1
        fi
        mkdir -p "${JNI_DIR}"
        cp so_dist/libekwing_resolver-arm64-v8a.so "${JNI_DIR}/libekwing_resolver.so"
        echo "libekwing_resolver.so 来自 ekwing_resolver ${TAG}" > "${JNI_DIR}/RESOLVER_VERSION.txt"
        rm -rf so_dist
        file "${JNI_DIR}/libekwing_resolver.so" | grep -q 'ELF 64-bit LSB shared object'
        readelf -s "${JNI_DIR}/libekwing_resolver.so" 2>/dev/null | grep -q JNI_OnLoad \
          || nm -D --defined-only "${JNI_DIR}/libekwing_resolver.so" 2>/dev/null | grep -q JNI_OnLoad
        sha256sum "${JNI_DIR}/libekwing_resolver.so"
